[package]
name = "tricked-bot"
version = "2.0.0"
authors = ["Tricked-dev"]
description = "A simple discord bot made for my [discord](https://discord.gg/mY8zTARu4g)"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"

[profile.release]
lto = true
codegen-units = 1

[dependencies]
askama = "0.16"
axum = { version = "0.8", default-features = false, features = ["form", "http1", "tokio"] }
base64 = "0.23"
clap = { version = "4.6", features = ["derive", "env"] }
color-eyre = "0.6"
deadpool-postgres = { version = "0.14", features = ["rt_tokio_1"] }
dotenvy = "0.15"
fasteval = "0.2"
futures-util = { version = "0.3", default-features = false }
png = "0.18"
postgres-from-row = "0.5"
rand = "0.10"
reqwest = { version = "0.13", features = ["json", "query", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["macros", "process", "rt-multi-thread", "sync", "time"] }
tokio-postgres = "0.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
twilight-cache-inmemory = "0.17"
twilight-gateway = "0.17"
twilight-http = "0.17"
twilight-interactions = "0.17"
twilight-model = "0.17"

[dev-dependencies]
axum = { version = "0.8", default-features = false, features = ["json"] }
tokio = { version = "1", features = ["net"] }
